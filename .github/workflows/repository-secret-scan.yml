name: Repository Secret Scan
on:
  workflow_dispatch:
  push:
    branches:
      - security/secret-scan-2026-10-17

permissions:
  contents: read

concurrency:
  group: repository-secret-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          chmod 755 gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan history and current files; export metadata only
        id: scan
        shell: bash
        run: python3 .github/security-scan/scan.py

      - name: Save findings metadata
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-metadata
          path: ${{ runner.temp }}/secret-scan-output/
          retention-days: 7
          if-no-files-found: warn
